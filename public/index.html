            <h1>SimasiaAI · fλow: βοηθός AI και CRM για ανθρώπους που φροντίζουν άλλους</h1>
            <p>Η <strong>SimasiaAI</strong> (Σημασία-ΑΙ Ι.Κ.Ε.) είναι ελληνική εταιρεία τεχνητής νοημοσύνης με κοινωνικό αποτύπωμα, με έδρα την Αθήνα. «Μέτρο μας ο Άνθρωπος.» Φτιάχνουμε το <strong>fλow</strong> για ΜΚΟ, συλλόγους ασθενών, δομές φροντίδας, ιατρεία και κλινικές σε Ελλάδα και Κύπρο.</p>
            <ul>
                <li>Το <strong>DialogosAI</strong> απαντά σε ασθενείς, οικογένειες και μέλη 24/7, στα ελληνικά και σε άλλες γλώσσες, μόνο από τις εγκεκριμένες πηγές του οργανισμού και με παραπομπές. Στο site, στο Viber, στο WhatsApp και με φωνή.</li>
                <li>Το <strong>PraxisAI</strong> είναι το CRM: καρτέλες μελών και ασθενών, ραντεβού, λήξεις, υπενθυμίσεις, follow-ups.</li>
                <li>Το <strong>MetronAI</strong> δείχνει τι ρωτούν οι άνθρωποι, ποιες ανάγκες μένουν αναπάντητες, με αναφορές για ομάδες και χορηγούς.</li>
            </ul>
            <p>Δεν δίνει ιατρικές συμβουλές και δεν κάνει διάγνωση. Συμμόρφωση με EU AI Act και GDPR, φιλοξενία στην ΕΕ, προσβασιμότητα WCAG. Για ΜΚΟ από 119 €/μήνα. Για ιατρεία από 149 €/μήνα με ετήσια συνδρομή, σε λειτουργία μέσα σε 48 ώρες ή δωρεάν.</p>
            <h2>Ήδη σε λειτουργία</h2>
            <p>Μυρτώ (Κάπα3, Κέντρο Καθοδήγησης Καρκινοπαθών), ΣΚΠ-i (ΠΟΑμΣΚΠ, Πανελλήνια Ομοσπονδία Ατόμων με Σκλήρυνση Κατά Πλάκας), BPAN Companion σε 60 γλώσσες (Ήρωες της BPAN) και Perfectaki Able για προσβάσιμη εκπαίδευση.</p>
            <h2 lang="en">In English</h2>
            <p lang="en"><strong>SimasiaAI</strong> is an AI company in Athens, Greece, building AI for social impact. Its product <strong>fλow</strong> is an AI assistant and CRM for NGOs, patient associations, disability services, doctors and clinics in Greece and Cyprus: DialogosAI answers patients and families 24/7 only from approved sources, PraxisAI keeps member and patient records, appointments and reminders, and MetronAI shows what people ask and what is missing. EU AI Act and GDPR compliant, EU-hosted. NGOs from €119/month.</p>
