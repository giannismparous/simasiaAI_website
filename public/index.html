            <h1>SimasiaAI · fλow: βοηθός AI και CRM για ανθρώπους που φροντίζουν άλλους</h1>
            <p>Η <strong>SimasiaAI</strong> (Σημασία-ΑΙ Ι.Κ.Ε.) είναι ελληνική εταιρεία τεχνητής νοημοσύνης με κοινωνικό αποτύπωμα, με έδρα την Αθήνα. «Μέτρο μας ο Άνθρωπος.» Φτιάχνουμε το <strong>fλow</strong> για ΜΚΟ, συλλόγους ασθενών, δομές φροντίδας, ιατρεία και κλινικές σε Ελλάδα και Κύπρο.</p>
            <ul>
                <li>Το <strong>DialogosAI</strong> (Λόγος) απαντά σε ασθενείς, ωφελούμενους, μέλη και οικογένειες 24/7, στο site, στο Viber και στο WhatsApp, μόνο από εγκεκριμένες πηγές και με παραπομπή. Λέει όταν δεν ξέρει, στέλνει τα επείγοντα σε άνθρωπο, καταλαβαίνει Greeklish και πολλές γλώσσες.</li>
                <li>Το <strong>PraxisAI</strong> (Πράξη) είναι το CRM με πράξεις AI: μητρώο μελών, φάκελοι ωφελούμενων, καρτέλες ασθενών, εργασίες με προθεσμίες, βιβλίο πρωτοκόλλου με αυτόματο αριθμό, υπενθυμίσεις προθεσμιών 60/30/7 μέρες πριν, επιβεβαίωση ραντεβού, παραδόσεις βάρδιας, σάρωση εγγράφων. Προτείνει και εκτελεί· ό,τι φεύγει το εγκρίνει άνθρωπος.</li>
                <li>Το <strong>MetronAI</strong> (Καταγραφή) καταγράφει κάθε επαφή και την αναλύει: στατιστικά επικοινωνίας, τι ρωτούν οι άνθρωποι και τι λείπει, αναφορές κοινωνικού αποτυπώματος για χορηγούς, μηνιαίο τεστ ακρίβειας.</li>
            </ul>
            <p>Δεν δίνει ιατρικές συμβουλές και δεν κάνει διάγνωση. Συμμόρφωση με EU AI Act και GDPR, δεδομένα στην ΕΕ, προσβασιμότητα WCAG. Χωρίς σταθερά πακέτα: σχεδιάζετε το fλow σας στο /go και λαμβάνετε αμέσως την προσφορά σας σε PDF στο email σας. Για ιατρεία, σε λειτουργία μέσα σε 48 ώρες ή δωρεάν.</p>
            <h2>Ήδη σε λειτουργία</h2>
            <p>Μυρτώ (Κάπα3, Κέντρο Καθοδήγησης Καρκινοπαθών), ΣΚΠ-i (ΠΟΑμΣΚΠ, Πανελλήνια Ομοσπονδία Ατόμων με Σκλήρυνση Κατά Πλάκας) και BPAN Companion σε 60 γλώσσες (Ήρωες της BPAN). Υπό κατασκευή: Perfectaki Able για προσβάσιμη εκπαίδευση.</p>
            <h2 lang="en">In English</h2>
            <p lang="en"><strong>SimasiaAI</strong> is an AI company in Athens, Greece, building AI for social impact. Its product <strong>fλow</strong> is an AI assistant and CRM for NGOs, patient associations, disability services, doctors and clinics in Greece and Cyprus: dialogue, action and record, in one flow. DialogosAI answers patients and families 24/7 only from approved sources, PraxisAI is the CRM with agentic actions (records, deadlines, protocol book, reminders, approved by a person), and MetronAI records every contact and shows what people ask and what is missing. EU AI Act and GDPR compliant, data in the EU. No fixed packages: you design your fλow at /go and receive your offer as a PDF by email.</p>
